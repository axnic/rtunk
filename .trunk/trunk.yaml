# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      # renovate: datasource=github-tags depName=trunk-io/plugins
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.27.0
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - gofmt@1.20.4
    # renovate: datasource=go depName=github.com/golangci/golangci-lint/v2/cmd/golangci-lint extractVersion=^v(?<version>.+)$
    - golangci-lint2@2.13.2
    # renovate: datasource=github-releases depName=anchore/grype
    - grype@0.118.0
    # renovate: datasource=github-releases depName=google/osv-scanner
    - osv-scanner@2.5.1
    # renovate: datasource=github-releases depName=tamasfe/taplo
    - taplo@0.10.0
    # renovate: datasource=pypi depName=checkov
    - checkov@3.3.17
    - git-diff-check
    # renovate: datasource=npm depName=markdownlint-cli
    - markdownlint@0.49.1
    # renovate: datasource=npm depName=prettier
    - prettier@3.9.6
    # renovate: datasource=github-releases depName=trufflesecurity/trufflehog
    - trufflehog@3.97.4
    # renovate: datasource=pypi depName=yamllint
    - yamllint@1.38.0
actions:
  disabled:
    - trunk-announce
  enabled:
    - commitlint
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
