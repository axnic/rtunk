version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.10.2
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
lint:
  enabled:
    - checkov@3.3.8
    - git-diff-check
    - gofmt@1.20.4
    - golangci-lint2@2.12.2
    - grype@0.116.0
    - markdownlint@0.45.0
    - prettier@3.6.2
    - taplo@0.10.0
    - trufflehog@3.95.9
    - yamllint@1.38.0
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
